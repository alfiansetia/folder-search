[package]
name = "folderscope"
version = "0.1.0"
edition = "2021"
description = "FolderScope Native — file manager (Rust + Slint, tanpa webview)"

[dependencies]
slint = "1.10"
rfd = "0.15"
open = "5"
ignore = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[build-dependencies]
slint-build = "1.10"
